<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#170a2e">
<title>奶茶星球 · Bubble Tycoon</title>
<!-- ★★ 分享卡（V21）：线上版独有的一环，App 里没有这个问题。
     ★ 原来只有 <title>，没有任何 og/twitter 标签 —— 分享链接到微信/QQ/Twitter 时
       没有标题、没有描述、没有缩略图，只剩一串 URL。线上版的主要增长路径
       就是"发链接给朋友"，这一步的转化几乎全靠这几个 meta。
     ★ 图片用 assets/icon-512.png：微信与大部分平台接受 512×512 方图，
       不需要额外做 1200×630 的横版（少一个资源，也就少一个 404 的机会）。
     ★ og:url 用绝对地址 —— Pages 部署在 /bubble-tycoon/ 子目录，
       相对路径在分享解析里会失效。 -->
<meta name="description" content="30 天从小摊做到奶茶帝国：研发配方、经营门店、应对随机事件，一局 15 分钟。打开即玩，无需下载。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="奶茶星球">
<meta property="og:title" content="奶茶星球 · 30 天街头奶茶帝国">
<meta property="og:description" content="研发配方、经营门店、应对随机事件，30 天把街头小摊做成奶茶帝国。打开即玩，无需下载。">
<meta property="og:url" content="https://xuancheng2024.github.io/bubble-tycoon/">
<meta property="og:image" content="https://xuancheng2024.github.io/bubble-tycoon/assets/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="奶茶星球 · 30 天街头奶茶帝国">
<meta name="twitter:description" content="研发配方、经营门店、应对随机事件，30 天把街头小摊做成奶茶帝国。打开即玩。">
<meta name="twitter:image" content="https://xuancheng2024.github.io/bubble-tycoon/assets/icon-512.png">
<!-- ★ 版本号（V21）：线上版没法像 App 那样看安装信息，
     玩家报问题时说"我玩的是哪版"就只能靠这个。
     ★ 与 sw.js 的 VERSION 保持一致 —— 两处不一致时，缓存清理会失灵。 -->
<meta name="app-version" content="v21.0">
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<!-- ★ PWA（V20.6）：让 H5 版能「装到桌面」并离线玩。
     ★ manifest 用相对路径 —— GitHub Pages 部署在子目录 /bubble-tycoon/ 下，
       绝对路径会 404（Pages 上最常见的坑）。 -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="奶茶星球">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="fx"></div>
<div id="toasts"></div>

<!-- ================= 开始界面 ================= -->
<section id="screen-title" class="screen active">
  <div class="title-wrap">
    <div class="logo">
      <div class="logo-cup">🧋</div>
      <h1>奶茶星球</h1>
      <p class="sub">BUBBLE TYCOON · 30 天街头奶茶帝国</p>
    </div>

    <div class="title-card">
      <div class="tc-row">
        <span class="tc-label">选择难度</span>
      </div>
      <div id="diffPick" class="diff-pick"></div>
    </div>

    <div class="title-btns">
      <button id="btnStart" class="btn btn-primary btn-big">🚀 开始营业</button>
      <button id="btnContinue" class="btn btn-ghost">💾 继续存档</button>
      <div class="btn-row">
        <button id="btnDaily" class="btn btn-amber">📅 每日挑战</button>
        <button id="btnDailyRank" class="btn btn-ghost">🏆 日榜</button>
      </div>
      <button id="btnLogin" class="btn btn-amber" data-act="login">🔥 连续登录</button>
      <div class="btn-row">
        <button id="btnHelp" class="btn btn-ghost">📖 玩法说明</button>
        <button id="btnImport" class="btn btn-ghost">📥 导入存档</button>
      </div>
      <div class="btn-row">
        <button id="btnExport" class="btn btn-ghost">📤 导出存档</button>
      </div>
    </div>
    <div id="slotPick" class="slot-pick"></div>

    <div id="metaBox" class="meta-box"></div>
    <p class="tip-line">💡 <span id="titleTip"></span></p>
  </div>
</section>

<!-- ================= 游戏主界面 ================= -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-left">
      <div class="hud-item"><span class="hi-k">DAY</span><span class="hi-v" id="hudDay">1<i>/30</i></span></div>
      <div class="hud-item"><span class="hi-k">现金</span><span class="hi-v money" id="hudCash" data-tut="cash">¥0</span></div>
      <div class="hud-item"><span class="hi-k">口碑</span><span class="hi-v" id="hudRep">0</span></div>
      <div class="hud-item"><span class="hi-k">净资产</span><span class="hi-v money" id="hudWorth">¥0</span></div>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="btnChart" title="经营报表">📈</button>
      <button class="icon-btn" id="btnHelp2" title="玩法说明">📖</button>
      <button class="icon-btn" id="btnSave" title="保存">💾</button>
      <button class="icon-btn" id="btnQuit" title="回主菜单">🏠</button>
    </div>
    <div class="goal-bar" data-tut="goal"><div class="goal-fill" id="goalFill"></div><div class="goal-ticks" id="goalTicks"></div><span class="goal-text" id="goalText"></span></div>
  </header>
  <!-- ★ V13.8：负债警示条（平时 display:none，不占空间）
       之前 debtDays 只存在于数据里，UI 完全不显示：
       玩家看到红色「¥-450」却不知道还能撑几天、怎么才算过关。 -->
  <div id="debtBar" class="debt-bar" hidden>⚠️ <b id="debtText"></b></div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="manage">🧋 经营</button>
    <button class="tab" data-tab="lab">🧪 研发</button>
    <button class="tab" data-tab="up">⬆️ 升级</button>
    <button class="tab" data-tab="staff">👥 员工</button>
    <button class="tab" data-tab="rival">🏙️ 商圈</button>
    <button class="tab" data-tab="ach">🏅 成就</button>
  </nav>

  <main class="panels" id="panels">
    <div class="panel active" id="panel-manage"></div>
    <div class="panel" id="panel-lab"></div>
    <div class="panel" id="panel-up"></div>
    <div class="panel" id="panel-staff"></div>
    <div class="panel" id="panel-rival"></div>
    <div class="panel" id="panel-ach"></div>
  </main>

  <!-- 营业舞台 -->
  <div class="stage" id="stage">
    <div class="stage-top">
      <div class="timebar"><div class="tb-fill" id="tbFill"></div><span class="tb-text" id="tbText">营业中</span></div>
      <div class="live">
        <div class="live-i"><span class="li-k">已卖</span><span class="li-v" id="lvServed">0</span></div>
        <div class="live-i"><span class="li-k">流失</span><span class="li-v bad" id="lvLost">0</span></div>
        <div class="live-i"><span class="li-k">营收</span><span class="li-v money" id="lvRev">¥0</span></div>
        <div class="live-i"><span class="li-k">连击</span><span class="li-v hot" id="lvCombo">0</span></div>
      </div>
    </div>
    <div class="queue-wrap" data-tut="queue">
      <div class="queue-label">🚶 排队中 <b id="qCount">0</b></div>
      <div class="queue" id="queue"></div>
    </div>
    <div class="stations" id="stations"></div>
    <div class="stage-actions">
      <button class="btn btn-rush" id="btnRush">⚡ 老板上阵 <i id="rushCd"></i></button>
      <button class="btn btn-ghost" id="btnPause">⏸ 暂停</button>
      <button class="btn btn-ghost" id="btnRestock">🚚 紧急进货</button>
      <button class="btn btn-ghost" id="btnClose">🔔 提前打烊</button>
    </div>
    <!-- 营业中两个即时决策（V2）：每天各一次。放在按钮排下面单独一行，
         因为它们是"要不要用"的判断，不是常规操作 —— 混在按钮堆里会被无脑点掉。 -->
    <div class="stage-ops">
      <button class="btn btn-op" id="btnSale">📣 限时促销 <i id="saleCd"></i></button>
      <button class="btn btn-op" id="btnPull">📥 临时下架</button>
    </div>
  </div>
</section>

<!-- ================= 结局界面 ================= -->
<section id="screen-end" class="screen">
  <div class="end-wrap" id="endWrap"></div>
</section>

<!-- ================= 新手引导层 ================= -->
<div id="tutLayer" class="tut-layer">
  <div class="tut-spot" id="tutSpot"></div>
  <div class="tut-card" id="tutCard">
    <div class="tc-head"><span id="tutStepNo"></span><b id="tutTitle"></b></div>
    <div class="tc-body" id="tutText"></div>
    <div class="tc-hint" id="tutHint"></div>
    <div class="tc-foot">
      <button class="btn btn-sm btn-ghost" id="tutSkip">跳过引导</button>
      <button class="btn btn-sm btn-primary" id="tutNext">下一步 →</button>
    </div>
  </div>
</div>

<!-- ================= 弹窗 ================= -->
<div id="modal" class="modal-root">
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<!-- V20.2：ui.js 按功能拆分（商圈/员工/研发/成就）。
     ★ 顺序要求：这些模块必须在 ui.js **之前**加载 ——
       ui.js 里的 PANEL_RENDERERS 会引用它们。
       ★ 虽然引用都在函数体内（惰性求值，调用时才解析），
         但提前加载能避免「首次渲染时函数还不存在」的时序风险。 -->
<script src="js/ui/stores.js"></script>
<script src="js/ui/staff.js"></script>
<script src="js/ui/lab.js"></script>
<script src="js/ui/ach.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
<script>
/* ★ 注册 Service Worker（V20.6）
 *
 * ★ 为什么要它：
 *   本作完全离线（0 处网络请求），但 H5 版要靠服务器提供文件 ——
 *   没装 SW 的话，地铁里没信号就白屏。
 *   ★ 装了之后 App Shell 被缓存，断网也能启动。
 *
 * ★ 三个必须处理的边界：
 *   ① **只在 HTTPS 或 localhost 下注册**
 *      —— file:// 下 registerServiceWorker 会直接抛错。
 *   ② **App（Capacitor）里不要注册**
 *      —— App 的资源本来就在本地（assets/public/），
 *         再套一层 SW 只会带来缓存不一致的麻烦。
 *      → 用 Capacitor 判定（见平台层的 isApp 逻辑）。
 *   ③ 注册失败**不能影响游戏** —— 整段包 try/catch。
 */
(function () {
  try {
    /* ① HTTPS / localhost 检查 */
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'https:' && location.hostname !== 'localhost'
        && location.hostname !== '127.0.0.1') return;

    /* ② App 里不注册（Capacitor 的资源本来就在本地） */
    if (window.Capacitor && window.Capacitor.isNativePlatform
        && window.Capacitor.isNativePlatform()) return;

    /* ③ 注册（失败不影响游戏） */
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function () {
        /* ★ V21：新版本接管时提示「刷新后生效」。
           ★ 为什么需要：sw.js 的 install 里是 skipWaiting() —— 新版本会立刻接管，
             但**当前页面里跑的仍是旧 JS**。玩家不刷新就一直在旧逻辑里，
             而界面上没有任何迹象。这是"改了没生效"最常见的一种。
           ★ 为什么不能首访就弹：首次安装时 clients.claim() 也会触发 controllerchange。
             用"注册前是否已有 controller"来区分 —— 没有 controller = 首访 = 不提示。
           ★ 只提示、不自动刷新：自动 reload 会打断正在营业的那一局（游戏内进度不一定存过档）。 */
        var hadController = !!navigator.serviceWorker.controller;
        if (!hadController) return;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (document.getElementById('updateBar')) return;
          var ver = document.querySelector('meta[name="app-version"]');
          var bar = document.createElement('div');
          bar.id = 'updateBar';
          bar.className = 'update-bar';
          bar.innerHTML = '<span>🎉 新版本已就绪' + (ver ? '（' + ver.content + '）' : '') + '</span>';
          var btn = document.createElement('button');
          btn.className = 'btn btn-primary';
          btn.textContent = '刷新';
          btn.onclick = function () { location.reload(); };
          var close = document.createElement('button');
          close.className = 'btn btn-ghost';
          close.textContent = '稍后';
          close.onclick = function () { bar.remove(); };
          bar.appendChild(btn);
          bar.appendChild(close);
          document.body.appendChild(bar);
        });
      }).catch(function (e) {
        if (window.console && console.warn) console.warn('SW 注册失败：', e);
      });
    });
  } catch (e) { /* 任何异常都不影响游戏启动 */ }
})();
</script>
</body>
</html>
