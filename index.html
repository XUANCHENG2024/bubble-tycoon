<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#170a2e">
<title>奶茶星球 · Bubble Tycoon</title>
<link rel="icon" type="image/png" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="fx"></div>
<div id="toasts"></div>

<!-- ================= 开始界面 ================= -->
<section id="screen-title" class="screen active">
  <div class="title-wrap">
    <div class="logo">
      <div class="logo-cup">🧋</div>
      <h1>奶茶星球</h1>
      <p class="sub">BUBBLE TYCOON · 30 天街头奶茶帝国</p>
    </div>

    <div class="title-card">
      <div class="tc-row">
        <span class="tc-label">选择难度</span>
      </div>
      <div id="diffPick" class="diff-pick"></div>
    </div>

    <div class="title-btns">
      <button id="btnStart" class="btn btn-primary btn-big">🚀 开始营业</button>
      <button id="btnContinue" class="btn btn-ghost">💾 继续存档</button>
      <div class="btn-row">
        <button id="btnDaily" class="btn btn-amber">📅 每日挑战</button>
        <button id="btnDailyRank" class="btn btn-ghost">🏆 日榜</button>
      </div>
      <button id="btnLogin" class="btn btn-amber" data-act="login">🔥 连续登录</button>
      <div class="btn-row">
        <button id="btnHelp" class="btn btn-ghost">📖 玩法说明</button>
        <button id="btnImport" class="btn btn-ghost">📥 导入存档</button>
      </div>
      <div class="btn-row">
        <button id="btnExport" class="btn btn-ghost">📤 导出存档</button>
      </div>
    </div>
    <div id="slotPick" class="slot-pick"></div>

    <div id="metaBox" class="meta-box"></div>
    <p class="tip-line">💡 <span id="titleTip"></span></p>
  </div>
</section>

<!-- ================= 游戏主界面 ================= -->
<section id="screen-game" class="screen">
  <header class="hud">
    <div class="hud-left">
      <div class="hud-item"><span class="hi-k">DAY</span><span class="hi-v" id="hudDay">1<i>/30</i></span></div>
      <div class="hud-item"><span class="hi-k">现金</span><span class="hi-v money" id="hudCash" data-tut="cash">¥0</span></div>
      <div class="hud-item"><span class="hi-k">口碑</span><span class="hi-v" id="hudRep">0</span></div>
      <div class="hud-item"><span class="hi-k">净资产</span><span class="hi-v money" id="hudWorth">¥0</span></div>
    </div>
    <div class="hud-right">
      <button class="icon-btn" id="btnChart" title="经营报表">📈</button>
      <button class="icon-btn" id="btnHelp2" title="玩法说明">📖</button>
      <button class="icon-btn" id="btnSave" title="保存">💾</button>
      <button class="icon-btn" id="btnQuit" title="回主菜单">🏠</button>
    </div>
    <div class="goal-bar" data-tut="goal"><div class="goal-fill" id="goalFill"></div><span class="goal-text" id="goalText"></span></div>
  </header>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="manage">🧋 经营</button>
    <button class="tab" data-tab="lab">🧪 研发</button>
    <button class="tab" data-tab="up">⬆️ 升级</button>
    <button class="tab" data-tab="staff">👥 员工</button>
    <button class="tab" data-tab="rival">🏙️ 商圈</button>
    <button class="tab" data-tab="ach">🏅 成就</button>
  </nav>

  <main class="panels" id="panels">
    <div class="panel active" id="panel-manage"></div>
    <div class="panel" id="panel-lab"></div>
    <div class="panel" id="panel-up"></div>
    <div class="panel" id="panel-staff"></div>
    <div class="panel" id="panel-rival"></div>
    <div class="panel" id="panel-ach"></div>
  </main>

  <!-- 营业舞台 -->
  <div class="stage" id="stage">
    <div class="stage-top">
      <div class="timebar"><div class="tb-fill" id="tbFill"></div><span class="tb-text" id="tbText">营业中</span></div>
      <div class="live">
        <div class="live-i"><span class="li-k">已卖</span><span class="li-v" id="lvServed">0</span></div>
        <div class="live-i"><span class="li-k">流失</span><span class="li-v bad" id="lvLost">0</span></div>
        <div class="live-i"><span class="li-k">营收</span><span class="li-v money" id="lvRev">¥0</span></div>
        <div class="live-i"><span class="li-k">连击</span><span class="li-v hot" id="lvCombo">0</span></div>
      </div>
    </div>
    <div class="queue-wrap" data-tut="queue">
      <div class="queue-label">🚶 排队中 <b id="qCount">0</b></div>
      <div class="queue" id="queue"></div>
    </div>
    <div class="stations" id="stations"></div>
    <div class="stage-actions">
      <button class="btn btn-rush" id="btnRush">⚡ 老板上阵 <i id="rushCd"></i></button>
      <button class="btn btn-ghost" id="btnPause">⏸ 暂停</button>
      <button class="btn btn-ghost" id="btnRestock">🚚 紧急进货</button>
      <button class="btn btn-ghost" id="btnClose">🔔 提前打烊</button>
    </div>
    <!-- 营业中两个即时决策（V2）：每天各一次。放在按钮排下面单独一行，
         因为它们是"要不要用"的判断，不是常规操作 —— 混在按钮堆里会被无脑点掉。 -->
    <div class="stage-ops">
      <button class="btn btn-op" id="btnSale">📣 限时促销 <i id="saleCd"></i></button>
      <button class="btn btn-op" id="btnPull">📥 临时下架</button>
    </div>
  </div>
</section>

<!-- ================= 结局界面 ================= -->
<section id="screen-end" class="screen">
  <div class="end-wrap" id="endWrap"></div>
</section>

<!-- ================= 新手引导层 ================= -->
<div id="tutLayer" class="tut-layer">
  <div class="tut-spot" id="tutSpot"></div>
  <div class="tut-card" id="tutCard">
    <div class="tc-head"><span id="tutStepNo"></span><b id="tutTitle"></b></div>
    <div class="tc-body" id="tutText"></div>
    <div class="tc-hint" id="tutHint"></div>
    <div class="tc-foot">
      <button class="btn btn-sm btn-ghost" id="tutSkip">跳过引导</button>
      <button class="btn btn-sm btn-primary" id="tutNext">下一步 →</button>
    </div>
  </div>
</div>

<!-- ================= 弹窗 ================= -->
<div id="modal" class="modal-root">
  <div class="modal-mask" id="modalMask"></div>
  <div class="modal-box" id="modalBox"></div>
</div>

<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
