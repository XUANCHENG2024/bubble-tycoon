# GitHub Pages（Jekyll）配置
#
# ★ 为什么需要这个文件：
#   内置的「pages build and deployment」workflow 用 Jekyll 构建**整个分支**，
#   于是 tools/（30+ 测试脚本）、docs/（内部文档）、
#   minigame/（小游戏端源码）、legal/ 都被发布了。
#   ★ 多发约 2.2MB，且把内部实现与测试脚本一并公开。
#
# ★ 为什么不用「切到 GitHub Actions 源」：
#   那需要仓库管理员去 Settings → Pages 改一次 Source。
#   ★ 而 exclude 只需要一个入库的配置文件 —— 克隆者拿到的是
#     「开箱即用的 Pages 配置」，不用任何手动步骤。
#   ★ 代价：产物仍来自分支（没有构建步骤），
#     所以要用 .nojekyll 跳过 Jekyll 处理。
#
# ★ exclude 的路径相对于**仓库根**：
#   Jekyll 只处理不被 exclude 的文件，其余原样复制到产物。
exclude:
  - .github
  - tools
  - docs
  - minigame
  - legal
  - dist
  - .ci-node
  - README.md
  - DEPLOY.md
  - 上线资料.md
  - 真机验证清单.md
  - node_modules
  - _cfg.yml
  - .gitignore

# ★ 只发布 H5 需要的：index.html / styles.css / js/ / assets/
#   其余文件（上面 exclude 掉的）全部不发布。
# ★ 注意 js/ 与 assets/ 不在 exclude 里 —— 它们是产物必需。
