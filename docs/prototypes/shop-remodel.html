<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>奶茶星球 · 店铺改造视觉原型</title>
<style>
/* ============================================================
   设计令牌 —— 与游戏内（styles.css）同一套命名与色值。
   ★ 原型必须能"搬得回去"：颜色/圆角/字号全部走令牌，
     否则做出来的东西和游戏里看起来是两款游戏。
   ============================================================ */
:root{
  --bg:#0f0719;
  --panel:#1b1030;
  --panel2:#241540;
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);

  --cyan:#35e5f0;
  --pink:#ff4d9d;
  --amber:#ffc247;
  --purple:#8b5cff;
  --green:#4ade80;

  --txt:#f4eeff;
  --txt2:#b3a6c9;
  --txt3:#7d7194;

  --fs-xs:10px;
  --fs-sm:11px;
  --fs-md:12px;
  --fs-lg:14px;
  --fs-xl:17px;

  --r-md:12px;
  --r-lg:18px;
  --r-pill:99px;
  --sh:0 10px 30px rgba(0,0,0,.45);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:400 14px/1.5 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* 手机优先的单列布局；宽屏时居中成"手机框" */
.app{
  height:100%;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  background:linear-gradient(180deg,#150a26,#0d0616 60%);
}

/* ---------- 顶栏 ---------- */
.top{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
}
.top h1{font-size:var(--fs-lg);margin:0;font-weight:800;letter-spacing:.5px}
.top .sub{font-size:var(--fs-sm);color:var(--txt3);margin-left:2px}
.top .spacer{flex:1}

/* 评分徽章：常驻右上，改造后数字滚动 */
.score{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:var(--r-pill);
  background:rgba(139,92,255,.16);border:1px solid rgba(139,92,255,.5);
  font-size:var(--fs-sm);color:var(--purple);
}
.score b{font-size:var(--fs-lg);color:var(--txt);font-variant-numeric:tabular-nums}

/* ---------- 舞台（店铺视窗） ---------- */
.stage{
  position:relative;flex:0 0 auto;
  margin:0 12px;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--sh);
  aspect-ratio:16/9;   /* 视窗固定比例，SVG 内部用 preserveAspectRatio 兜住 */
  background:#120a20;
}
.stage svg{display:block;width:100%;height:100%}

/* 改造前后的两层叠放：before 在上，用 clip-path 切出左半边 */
.stage .layer{position:absolute;inset:0}
.stage .layer.before{
  /* ★ 用 --split 控制切口位置，拖动时只改一个变量，不重排 DOM */
  clip-path:inset(0 calc(100% - var(--split,50%)) 0 0);
  z-index:2;
}
.stage .layer.after{z-index:1}

/* 分割线 + 把手 */
.split{
  position:absolute;top:0;bottom:0;left:var(--split,50%);
  width:2px;background:linear-gradient(180deg,transparent,rgba(255,255,255,.85),transparent);
  z-index:5;pointer-events:none;opacity:0;transition:opacity .2s;
}
.split::after{
  content:'';position:absolute;top:50%;left:50%;translate:-50% -50%;
  width:30px;height:30px;border-radius:50%;
  background:rgba(15,7,25,.9);border:1.5px solid rgba(255,255,255,.7);
  box-shadow:0 0 14px rgba(53,229,240,.6);
}
.stage.compare .split{opacity:1}
/* 可拖动区域：比线宽得多，手机上才好抓 */
.stage.compare .hit{
  position:absolute;inset:0;z-index:6;cursor:ew-resize;touch-action:none;
}

/* 对比开关 */
.cmp-btn{
  position:absolute;right:10px;bottom:10px;z-index:7;
  padding:6px 12px;border-radius:var(--r-pill);
  background:rgba(15,7,25,.78);border:1px solid var(--line2);
  font-size:var(--fs-sm);color:var(--txt2);
}
.cmp-btn.on{color:var(--cyan);border-color:rgba(53,229,240,.6)}

/* 差异标签：切换对比时对新增元素打标 */
.difftag{
  position:absolute;z-index:6;padding:3px 9px;border-radius:var(--r-pill);
  background:rgba(53,229,240,.92);color:#06222a;font-size:var(--fs-xs);font-weight:800;
  white-space:nowrap;pointer-events:none;
  animation:tagIn .32s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes tagIn{from{opacity:0;transform:translateY(6px) scale(.8)}to{opacity:1;transform:none}}

/* ---------- 改造槽位 ---------- */
.slots{
  flex:1 1 auto;overflow-y:auto;
  padding:12px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;
  align-content:start;
}
.slot{
  position:relative;text-align:left;
  padding:11px 12px;border-radius:var(--r-md);
  background:var(--panel);border:1px solid var(--line);
  transition:border-color .18s,background .18s,transform .18s;
}
.slot:active{transform:scale(.985)}
.slot.on{border-color:rgba(53,229,240,.75);background:rgba(53,229,240,.08)}
.slot.maxed{opacity:.55}
.slot-h{display:flex;align-items:center;gap:6px;font-size:var(--fs-md);font-weight:700}
.slot-h .pr{font-size:var(--fs-xs);color:var(--txt3);font-weight:400;margin-left:auto}
.pips{display:flex;gap:3px;margin-top:7px}
.pip{width:13px;height:4px;border-radius:2px;background:rgba(255,255,255,.13)}
.pip.f{background:linear-gradient(90deg,var(--cyan),var(--purple))}
.slot-b{margin-top:7px;font-size:var(--fs-xs);color:var(--txt2);line-height:1.45}
.slot-b b{color:var(--amber)}
.slot .cost{color:var(--amber);font-variant-numeric:tabular-nums}

/* ---------- 底部确认条 ---------- */
.bar{
  flex:0 0 auto;padding:11px 14px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:rgba(20,11,36,.94);
  backdrop-filter:blur(8px);
}
.bar .row{display:flex;align-items:center;gap:10px}
.bar .info{flex:1;min-width:0}
.bar .info .t{font-size:var(--fs-sm);color:var(--txt2)}
.bar .info .t b{color:var(--txt)}
.bar .info .gain{font-size:var(--fs-xs);color:var(--green);margin-top:2px}
.btn{
  padding:11px 20px;border-radius:var(--r-md);font-weight:800;font-size:var(--fs-md);
  background:linear-gradient(135deg,var(--cyan),var(--purple));color:#0a0514;
  box-shadow:0 6px 18px rgba(53,229,240,.28);
  transition:transform .12s;
}
.btn:active{transform:scale(.97)}
.btn[disabled]{background:rgba(255,255,255,.08);color:var(--txt3);box-shadow:none}

/* ---------- 状态反馈 ---------- */
/* 飘字：+8 口碑 / +120 客流 */
.float{
  position:absolute;z-index:8;pointer-events:none;font-weight:800;
  font-size:var(--fs-lg);text-shadow:0 2px 10px rgba(0,0,0,.6);
  animation:floatUp 1.1s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translateY(6px) scale(.9)}
  18%{opacity:1;transform:translateY(0) scale(1)}
  100%{opacity:0;transform:translateY(-42px) scale(1)}
}
/* 星光粒子 */
.spark{
  position:absolute;z-index:7;width:6px;height:6px;border-radius:50%;
  pointer-events:none;background:var(--amber);
  box-shadow:0 0 10px currentColor;
  animation:spark .95s ease-out forwards;
}
@keyframes spark{
  0%{opacity:0;transform:translate(0,0) scale(.4)}
  20%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.2)}
}
/* 店铺整体闪光（改造瞬间） */
.flash{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:radial-gradient(circle at 50% 62%,rgba(255,226,138,.55),transparent 62%);
  animation:flash .5s ease-out forwards;
}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

/* ---------- SVG 元素的状态过渡 ---------- */
/* ★ 这是"改造动效"的核心：所有部件都靠 opacity + transform 过渡，
   不重绘、不重排 DOM —— 所以 8 级变化都是连续的，不会跳帧。 */
.part{
  transition:opacity .46s ease,transform .52s cubic-bezier(.34,1.56,.64,1);
  transform-box:fill-box;transform-origin:50% 100%;
}
.part.off{opacity:0;transform:scale(.82) translateY(6px)}
.part.on{opacity:1;transform:none}

/* 灯串/霓虹的呼吸 */
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.lit{animation:breathe 3.2s ease-in-out infinite}

/* 星星闪烁（错开相位，避免整片一起闪） */
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
.star{animation:twinkle 4s ease-in-out infinite}

/* 新元素描边脉冲（差异高亮用） */
@keyframes pulseTag{
  0%{stroke-width:0;stroke-opacity:0}
  35%{stroke-width:3;stroke-opacity:1}
  100%{stroke-width:0;stroke-opacity:0}
}
.pulsing{animation:pulseTag 1.1s ease-out 2}
</style>
</head>
<body>
<div class="app">

  <div class="top">
    <h1>🏪 店铺改造</h1>
    <span class="sub">视觉原型 · 6 个改造项</span>
    <span class="spacer"></span>
    <div class="score">评分 <b id="score">0</b></div>
  </div>

  <!-- ================= 店铺视窗 ================= -->
  <div class="stage" id="stage">
    <!-- before 层：改造前的样子（用于拖动对比） -->
    <div class="layer before" id="layerBefore"></div>
    <!-- after 层：当前/改造后 -->
    <div class="layer after" id="layerAfter"></div>

    <div class="split"></div>
    <div class="hit" id="hit"></div>
    <button class="cmp-btn" id="cmpBtn">⇆ 对比改造前</button>
  </div>

  <!-- ================= 改造项 ================= -->
  <div class="slots" id="slots"></div>

  <!-- ================= 确认条 ================= -->
  <div class="bar">
    <div class="row">
      <div class="info">
        <div class="t" id="barTitle">选一个改造项</div>
        <div class="gain" id="barGain"></div>
      </div>
      <button class="btn" id="goBtn" disabled>改造</button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   1. 数据：改造项定义
   ★ 每项独立 0~3 级（不是一条总等级）。
     理由：玩家一次只想改一件东西；拆开之后"我加了雨棚"才有具体所指，
     而不是"我升到 Lv.5 了"这种没有画面感的概念。
   ============================================================ */
const SLOTS = [
  { id:'sign',   name:'门头招牌', emoji:'🪧', max:3, base:380,  gainRep:2.0, top:'小摊挂布', steps:['铁皮挂牌','亚克力灯箱','霓虹描边','金字招牌'] },
  { id:'awning', name:'遮阳雨棚', emoji:'⛱️', max:2, base:260,  gainRep:1.2, top:'无', steps:['条纹雨棚','加宽雨棚'] },
  { id:'seat',   name:'户外桌椅', emoji:'🪑', max:2, base:300,  gainRep:1.5, top:'无', steps:['2 套桌椅','4 套 + 遮阳伞'] },
  { id:'plant',  name:'绿植花箱', emoji:'🪴', max:2, base:180,  gainRep:0.9, top:'无', steps:['门边 2 盆','花箱 + 悬挂绿萝'] },
  { id:'light',  name:'灯串与照明', emoji:'💡', max:2, base:220, gainRep:1.1, top:'一盏白炽灯', steps:['暖光壁灯','串灯 + 地灯'] },
  { id:'upper',  name:'二层阁楼', emoji:'🏠', max:1, base:1200, gainRep:3.0, top:'无', steps:['二层小窗 + 露台'] },
];

/* 颜色随"整体完成度"变化：墙皮从冷灰 -> 暖米 -> 金 */
const WALL_TINTS = ['#3a3050','#463a5e','#544668','#6b5a7a','#8a7080','#a8848a','#c39a8c','#dcb08f'];

/* ============================================================
   2. SVG 模板
   ★ 全部手绘路径，不引用任何外部图片 —— 满足"单文件、无依赖"。
   ★ 每个可改造部件都带 class="part" 与 data-part，由 applyState() 统一控制。
   ============================================================ */
function shopSvg(){

    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">

        <rect x="318" y="184" width="164" height="52" rx="10" fill="#1e1130"/>

      <g class="part off" data-part="sign3">

    <!-- 暖光晕（整体氛围，随照明强度） -->

}

/* ============================================================
   3. 状态与渲染
   ============================================================ */
const state = { levels:{ sign:0, awning:0, seat:0, plant:0, light:0, upper:0 }, before:null };

const $ = id => document.getElementById(id);
const stage = $('stage'), layerAfter = $('layerAfter'), layerBefore = $('layerBefore');

/* 总完成度 0~1：驱动墙色、暖光强度这些"整体感" */
function progress(){
  let cur = 0, max = 0;
  for (const s of SLOTS){ cur += state.levels[s.id]; max += s.max; }
  return max ? cur / max : 0;
}

/* 把 state 映射到 SVG 部件上。
   ★ 只改 class 与少量属性，不重建 DOM —— 这样 CSS transition 才能生效。
     重建 DOM 会让"改造动效"变成硬切。 */
function applyState(root, lv){
  const p = (() => { let a = 0, b = 0; for (const s of SLOTS){ a += lv[s.id]; b += s.max; } return b ? a / b : 0; })();

  /* 墙色：按完成度插值（冷灰 -> 暖米） */
  const idx = Math.min(WALL_TINTS.length - 1, Math.round(p * (WALL_TINTS.length - 1)));
  const wall = root.querySelector('#wall');
  if (wall) wall.setAttribute('fill', WALL_TINTS[idx]);

  /* 暖光与窗光随完成度变亮 */
  const g = root.querySelector('#glow');
  if (g) g.setAttribute('opacity', (0.35 + p * 0.5).toFixed(3));
  const w1 = root.querySelector('#win1'), w2 = root.querySelector('#win2');
  if (w1) w1.setAttribute('opacity', (0.35 + (lv.light / 2) * 0.5 + p * 0.2).toFixed(3));
  if (w2) w2.setAttribute('opacity', (0.32 + (lv.light / 2) * 0.5 + p * 0.2).toFixed(3));

  /* 招牌：4 级各有独立部件，只亮当前那一级 */
  for (let i = 0; i < 4; i++){
    const el = root.querySelector(`[data-part="sign${i}"]`);
    if (el) el.classList.toggle('off', lv.sign !== i);
  }
  /* 其它项：>0 就显示（数值差异体现在文案与评分上，视觉上"有/没有"更清晰） */
  for (const id of ['awning','seat','plant','light','upper']){
    const el = root.querySelector(`[data-part="${id}"]`);
    if (el) el.classList.toggle('off', lv[id] <= 0);
  }
}

/* 生成一层 SVG */
function mountLayer(host, lv){
  host.innerHTML = shopSvg();
  applyState(host, lv);
}

/* ============================================================
   4. 改造项列表
   ============================================================ */
let picked = null;

function renderSlots(){
  const box = $('slots');
  box.innerHTML = '';
  for (const s of SLOTS){
    const lv = state.levels[s.id];
    const maxed = lv >= s.max;
    const cost = Math.round(s.base * Math.pow(1.55, lv));
    const b = document.createElement('button');
    b.className = 'slot' + (picked === s.id ? ' on' : '') + (maxed ? ' maxed' : '');
    b.innerHTML = `
      <div class="slot-h">${s.emoji} ${s.name}
        <span class="pr">Lv.${lv}/${s.max}</span>
      </div>
      <div class="pips">${Array.from({length:s.max},(_,i)=>
        `<span class="pip${i<lv?' f':''}"></span>`).join('')}</div>
      <div class="slot-b">${maxed
        ? `已达顶级 · <b>${s.top === '无' ? s.steps[s.steps.length-1] : s.top}</b>`
        : `下一级：<b>${s.steps[lv]}</b><br>花费 <span class="cost">¥${cost}</span> · 口碑 +${s.gainRep}`}
      </div>`;
    b.onclick = () => { picked = maxed ? null : s.id; renderSlots(); renderBar(); };
    box.appendChild(b);
  }
}

function renderBar(){
  const btn = $('goBtn'), t = $('barTitle'), g2 = $('barGain');
  if (!picked){ t.textContent = '选一个改造项'; g2.textContent = ''; btn.disabled = true; btn.textContent = '改造'; return; }
  const s = SLOTS.find(x => x.id === picked);
  const lv = state.levels[s.id];
  const cost = Math.round(s.base * Math.pow(1.55, lv));
  t.innerHTML = `打造 <b>${s.emoji} ${s.name}</b> → Lv.${lv+1} · <b>${s.steps[lv]}</b>`;
  g2.textContent = `口碑 +${s.gainRep} · 评分 +${Math.round(100 / SLOTS.reduce((a,x)=>a+x.max,0))}`;
  btn.disabled = false;
  btn.textContent = `改造 ¥${cost}`;
}

/* ============================================================
   5. 改造动效
   ------------------------------------------------------------
   分四拍：旧态淡出 → 新态弹入 → 暖光闪一下 → 星光 + 飘字 + 数字滚动。
   ★ 为什么不能一步到位：一次完成的变化看起来像"切换图片"，
     拆成四拍才有"施工"的感觉，也才配得上"改造"这个词。
   ============================================================ */
function doUpgrade(){
  if (!picked) return;
  const s = SLOTS.find(x => x.id === picked);
  if (state.levels[s.id] >= s.max) return;

  /* 记下改造前的状态，供对比模式使用 */
  state.before = Object.assign({}, state.levels);

  const el = layerAfter.querySelector(`[data-part="${s.id}"]`);
  if (el) el.classList.add('pulsing');

  state.levels[s.id]++;
  const beforeScore = scoreOf(state.before);
  applyState(layerAfter, state.levels);

  /* 舞台反馈 */
  const rect = stage.getBoundingClientRect();
  const fx = document.createElement('div');
  fx.className = 'flash';
  stage.appendChild(fx);
  setTimeout(() => fx.remove(), 520);

  burst(rect);
  floatText(rect, `+${s.gainRep} 口碑`, '#4ade80', 0.38);
  floatText(rect, `评分 +${scoreOf(state.levels) - beforeScore}`, '#35e5f0', 0.62);

  rollTo($('score'), beforeScore, scoreOf(state.levels));

  /* 重新渲染对比层的 before（用上一级状态） */
  if (stage.classList.contains('compare')) mountLayer(layerBefore, state.before);

  renderSlots(); renderBar();
}

function scoreOf(lv){
  let a = 0, b = 0;
  for (const s of SLOTS){ a += lv[s.id] * (1 / s.max); b += 1; }
  return Math.round(a / b * 100);
}

/* 星光粒子：从店铺中心向外扩散 */
function burst(rect){
  const cx = rect.width * 0.5, cy = rect.height * 0.62;
  for (let i = 0; i < 16; i++){
    const sp = document.createElement('span');
    sp.className = 'spark';
    const ang = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
    const dist = 40 + Math.random() * 70;
    sp.style.left = cx + 'px';
    sp.style.top = cy + 'px';
    sp.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
    sp.style.setProperty('--dy', (Math.sin(ang) * dist - 22) + 'px');
    sp.style.background = i % 3 === 0 ? '#35e5f0' : (i % 3 === 1 ? '#ffc247' : '#ff4d9d');
    sp.style.animationDelay = (Math.random() * 0.1).toFixed(2) + 's';
    stage.appendChild(sp);
    setTimeout(() => sp.remove(), 1100);
  }
}

function floatText(rect, text, color, yRatio){
  const f = document.createElement('div');
  f.className = 'float';
  f.textContent = text;
  f.style.color = color;
  f.style.left = rect.width * 0.5 + 'px';
  f.style.top = rect.height * yRatio + 'px';
  f.style.transform = 'translateX(-50%)';
  stage.appendChild(f);
  setTimeout(() => f.remove(), 1200);
}

/* 数字滚动：改造的"收获感"有一半来自这个 */
function rollTo(el, from, to){
  const t0 = performance.now(), dur = 620;
  (function step(t){
    const k = Math.min(1, (t - t0) / dur);
    const e = 1 - Math.pow(1 - k, 3);          /* ease-out cubic */
    el.textContent = Math.round(from + (to - from) * e);
    if (k < 1) requestAnimationFrame(step);
  })(t0);
}

/* ============================================================
   6. 改造前后对比：拖动分割
   ★ 用 clip-path + 一个 CSS 变量，拖动时只改变量 ——
     不需要每帧重绘 SVG，手机上也不掉帧。
   ============================================================ */
let dragging = false;

function setSplit(pct){
  const v = Math.max(4, Math.min(96, pct));
  stage.style.setProperty('--split', v + '%');
  const sp = stage.querySelector('.split');
  if (sp) sp.style.left = v + '%';
}

function toggleCompare(){
  const on = !stage.classList.contains('compare');
  stage.classList.toggle('compare', on);
  $('cmpBtn').classList.toggle('on', on);
  $('cmpBtn').textContent = on ? '⇆ 关闭对比' : '⇆ 对比改造前';

  if (on){
    /* before 层：优先用"上一次改造前"的状态；没有改造过就显示全 0 */
    const base = state.before || { sign:0, awning:0, seat:0, plant:0, light:0, upper:0 };
    mountLayer(layerBefore, base);
    setSplit(50);
    showDiffTags(base);
  } else {
    layerBefore.innerHTML = '';
  }
}

/* 差异标签：把"这次多出来的东西"直接标在画面外沿 */
function showDiffTags(base){
  stage.querySelectorAll('.difftag').forEach(n => n.remove());
  if (!state.before) return;
  const added = SLOTS.filter(s => state.levels[s.id] > base[s.id]);
  added.slice(0, 3).forEach((s, i) => {
    const tag = document.createElement('div');
    tag.className = 'difftag';
    tag.textContent = `新增：${s.name}`;
    tag.style.left = '50%';
    tag.style.top = (46 + i * 15) + '%';
    stage.appendChild(tag);
    setTimeout(() => tag.remove(), 2600);
  });
}

/* 拖动 */
$('hit').addEventListener('pointerdown', e => {
  if (!stage.classList.contains('compare')) return;
  dragging = true;
  $('hit').setPointerCapture && $('hit').setPointerCapture(e.pointerId);
  move(e);
});
$('hit').addEventListener('pointermove', e => { if (dragging) move(e); });
$('hit').addEventListener('pointerup', () => { dragging = false; });
$('hit').addEventListener('pointercancel', () => { dragging = false; });
function move(e){
  const r = stage.getBoundingClientRect();
  setSplit(((e.clientX - r.left) / r.width) * 100);
}

/* ============================================================
   7. 启动
   ============================================================ */
mountLayer(layerAfter, state.levels);
renderSlots();
renderBar();
$('cmpBtn').onclick = toggleCompare;
$('goBtn').onclick = doUpgrade;
$('score').textContent = '0';

/* 首屏自检：确保 SVG 里的关键部件挂上了（改了模板忘记同步 data-part 会被这里抓出来） */
(function selfCheck(){
  const need = ['sign0','sign1','sign2','sign3','awning','seat','plant','light','upper'];
  const missing = need.filter(k => !layerAfter.querySelector(`[data-part="${k}"]`));
  if (missing.length) console.warn('SVG 缺少部件：', missing.join(', '));
})();
</script>
