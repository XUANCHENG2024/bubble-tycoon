# 发版前全量检查：11 套 + 平衡模拟 + 界面诊断
#
# ★ 为什么要单独一档：
#   quick-check 不含平衡模拟（要跑 48 局，较慢）与界面诊断
#   （含注入验证类断言）。这两项在「提交」时不必每次跑，
#   但**发版前必须跑** —— 平衡失控是玩家能直接感知的问题。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full:
    name: 全量检查 + 平衡
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ 装 jsdom —— 四个 DOM 测试需要它
      #   （browser-smoke / mobile-smoke / xss-verify / check-dist-boot）
      # ★ 装到 .ci-node/ 而不是 node_modules/：
      #   项目根刻意保持零依赖（无 package.json），
      #   不想让 clone 的人以为要跑 npm install。
      - name: 安装 jsdom（DOM 测试依赖）
        run: node tools/install-jsdom.js

      # ★ 后续步骤统一读这个变量
      - name: 设置 JSDOM_PATH
        run: echo "JSDOM_PATH=$PWD/.ci-node/node_modules/jsdom" >> $GITHUB_ENV

      - name: 全部 11 套
        run: |
          set -e
          for t in probe dom-smoke browser-smoke minigame-smoke mobile-smoke \
                   symbol-check xss-verify e2e-flow verify-checklist \
                   diag-coupling diag-edge diag-ui check-doc-refs check-escape check-leak check-extreme check-save-compat check-iso check-iso-stage check-crosslink check-deadbtn check-ui-spec check-balance; do
          # 重复代码：8 行以上且非数据表
          node tools/check-dup.js 8 || exit 1
            printf '%-20s ' "$t"
            # ★ 用 run-ci-test.js 包装，且**不再丢弃输出**（> /dev/null）：
            #   原来失败时 Actions 日志里只有一个「✘」，
            #   完整输出被重定向到 /dev/null 丢掉了 ——
            #   排查「本地过 / CI 挂」时**什么都看不到**，只能猜。
            # ★ 包装器失败时还会打印平台 / Node 版本 / 关键文件是否存在。
            node tools/run-ci-test.js "tools/$t.js"
            echo "PASS"
          done

      - name: 平衡模拟（三难度 × 16 局）
        run: node tools/sim.js 16

      - name: 小游戏端构建（平台配置校验）
        run: node tools/build-minigame.js