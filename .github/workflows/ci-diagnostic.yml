# CI 诊断：把失败详情推到一个分支，供外部读取
#
# ★ 为什么需要这个：
#   Actions 的 job 日志要**管理员权限**才能下（API 403），
#   check-run 的 output 也是空的 —— 也就是说「CI 挂了」时
#   **看不到任何失败详情**，只能靠猜。
#   ★ 排查「本地过 / CI 挂」这类平台差异，
#     没有输出就等于在盲猜（我试了查步骤名、查缺文件、
#     查行尾 —— 全都没定位到）。
#   ★ 把结果推到分支上，API 匿名就能读 —— 这是唯一可靠的取法。
#
# ★ 用法：本地用 curl 触发，或推 commit 自动触发
#   workflow_dispatch:
# ★ 用法：手动触发（Actions 页 → Run workflow）
#   触发后把诊断报告推到 ci-diagnostic 分支，用 raw.githubusercontent 读。
# ★ 刻意**不**挂 push 触发 —— 每次推送都跑一遍太浪费，
#   而它的用途本来就是「CI 挂了才需要」。
on:
  workflow_dispatch:

permissions:
  contents: write    # ★ 需要推分支

jobs:
  diagnose:
    name: 诊断（Linux 环境）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装 jsdom
        run: node tools/install-jsdom.js

      - name: 设置 JSDOM_PATH
        run: echo "JSDOM_PATH=$PWD/.ci-node/node_modules/jsdom" >> $GITHUB_ENV

      - name: 跑小游戏冒烟并收集诊断
        # ★ 用 tee 落盘，且 pipefail 保证退出码不被吞
        run: |
          set -o pipefail
          node tools/minigame-smoke.js > /tmp/mg.log 2>&1 || true
          echo "--- 输出末尾 80 行 ---" >> /tmp/mg.log
          tail -80 /tmp/mg.log >> /tmp/mg.log.tail
          {
            echo "# CI 诊断"
            echo ""
            echo "时间: $(date -u +%FT%TZ)"
            echo "Node: $(node -v)"
            echo "平台: $(uname -a)"
            echo ""
            echo '## 失败/输出（末尾 120 行）'
            echo '```'
            tail -120 /tmp/mg.log
            echo '```'
            echo ""
            echo '## 关键文件是否存在'
            echo '```'
            for f in index.html styles.css js/data.js js/engine.js js/ui.js js/main.js js/ui/stores.js minigame/bundle.js; do
              [ -f "$f" ] && echo "OK   $f" || echo "MISS $f"
            done
            echo '```'
            echo ""
            echo '## bundle.js 行尾'
            echo '```'
            printf 'CRLF: %s\n' "$(grep -c $'\r$' minigame/bundle.js 2>/dev/null || echo 0)"
            printf '总行: %s\n' "$(wc -l < minigame/bundle.js 2>/dev/null || echo 0)"
            echo '```'
            echo ""
            echo '## 关键环境变量'
            echo '```'
            env | grep -iE 'jsdom|ci|node|path' | sort | head -30
            echo '```'
          } > DIAGNOSIS.md

      - name: 推到 ci-diagnostic 分支
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-diagnostic
          git add DIAGNOSIS.md
          git commit -m "ci: 诊断报告 $(date -u +%FT%TZ)" || echo "（无变化）"
          git push origin ci-diagnostic --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
