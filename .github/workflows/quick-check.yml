# 快速检查：改动引擎/UI 后跑这套（< 30 秒）
#
# ★ 为什么分级：
#   这套测试是本项目唯一的自动化防线（11 套、约 700 项断言）。
#   但每次提交都全跑会让 CI 变慢，而「改动没碰到的部分」也不该拖慢反馈。
#   所以分两档：
#     ① quick  —— 引擎 + UI + 两版对等（改动最常碰到的）
#     ② full   —— 全部 11 套 + 平衡模拟（提交/发版前跑）
name: Quick Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # 同一分支的新 push 会取消旧的未完成 run（省 Actions 配额）
  group: quick-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # ★ 失败时建 Issue（诊断信息要公开可读 —— Actions 日志要管理员权限才能下，
  #   API 取 logs 返回 403、check-run 的 output 也是空的，
  #   看不到失败详情就只能靠猜）
  issues: write

jobs:
  test:
    name: 引擎 + UI 快速检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ★ 装 jsdom —— 四个 DOM 测试需要它
      #   （browser-smoke / mobile-smoke / xss-verify / check-dist-boot）
      # ★ 装到 .ci-node/ 而不是 node_modules/：
      #   项目根刻意保持零依赖（无 package.json），
      #   不想让 clone 的人以为要跑 npm install。
      - name: 安装 jsdom（DOM 测试依赖）
        run: node tools/install-jsdom.js

      # ★ 后续步骤统一读这个变量
      - name: 设置 JSDOM_PATH
        run: echo "JSDOM_PATH=$PWD/.ci-node/node_modules/jsdom" >> $GITHUB_ENV

      - name: 检查文档交叉引用（归档后最易断的）
        run: node tools/check-doc-refs.js

      - name: 引擎探针（数据模型不变式 + 城市可用性）
        run: node tools/probe.js

      - name: DOM 冒烟
        run: node tools/dom-smoke.js

      - name: 真实 DOM 冒烟（H5）
        run: |
          set -o pipefail
          node tools/run-ci-test.js tools/browser-smoke.js 2>&1 | tee /tmp/ci-test.log


      - name: 小游戏冒烟（Canvas 端对等）
        run: |
          set -o pipefail
          node tools/run-ci-test.js tools/minigame-smoke.js 2>&1 | tee /tmp/ci-test.log


      - name: 移动端布局
        run: |
          set -o pipefail
          node tools/run-ci-test.js tools/mobile-smoke.js 2>&1 | tee /tmp/ci-test.log


      - name: 符号对等（两版引擎符号一致性）
        run: node tools/symbol-check.js

      - name: XSS 注入
        run: |
          set -o pipefail
          node tools/run-ci-test.js tools/xss-verify.js 2>&1 | tee /tmp/ci-test.log


      - name: 存档可控字段转义（逐字段污染 + 扫全部面板）
        run: node tools/check-escape.js

      - name: 源码注释是否泄漏到界面
        run: node tools/check-leak.js

      - name: 极端状态扫描（NaN / 死循环 / 存档往返）
        run: node tools/check-extreme.js

      - name: 多分辨率适配（CSS 固定宽度 / 视口 / 关键操作）
        run: node tools/check-responsive.js

      - name: 存档向后兼容（迁移链 / 老存档实跑 / 脏版本输入）
        run: node tools/check-save-compat.js

      - name: 等距投影数学（互逆 / 排序 / 性能）
        run: node tools/check-iso.js

      - name: 伪 3D 舞台（多视口可达 / 深度顺序 / 输入不变）
        run: node tools/check-iso-stage.js

      - name: 原料↔配方双向关联（反向索引 / 跳转 / 状态提示）
        run: node tools/check-crosslink.js

      - name: 死按钮（每个 data-act 都有处理路径且点得动）
        run: node tools/check-deadbtn.js

      - name: 研发界面规范（可访问性 / 设计令牌 / 响应式 / 交互状态）
        run: node tools/check-ui-spec.js

      - name: 难度曲线与存档容错（阶段目标 / 明日建议 / 损坏恢复）
        run: node tools/check-balance.js

      - name: 两端口径一致（阶段目标金额 / 锚点判定）
        run: node tools/check-parity-goal.js

      - name: 发布产物启动自检（脚本顺序 / 模块挂载 / 各面板渲染）
        run: node tools/build-dist.js && node tools/check-dist-boot.js

      - name: App 方案检查（同步存储 / 原生插件 / 体积上限）
        # ★ 依赖 app/node_modules（Capacitor CLI）——
        #   CI 里要先 npm install 一次。
        run: |
          if [ -d app/node_modules ]; then
            node tools/build-app-web.js
            node tools/check-app.js
          else
            echo '::notice::app/node_modules 不存在，跳过 App 检查（首次 clone 时正常）'
          fi

      - name: 主流程
        run: node tools/e2e-flow.js

      - name: 上线清单自动化部分
        run: node tools/verify-checklist.js