# GitHub Pages（Jekyll）配置
#
# ★ 为什么需要这个文件：
#   内置的「pages build and deployment」workflow 用 Jekyll 构建**整个分支**，
#   于是 tools/（30+ 测试脚本）、docs/（内部文档）、
#   minigame/（小游戏端源码）、legal/ 都被发布了。
#   ★ 多发约 2.2MB，且把内部实现与测试脚本一并公开。
#
# ★ 为什么不用「切到 GitHub Actions 源」：
#   那需要仓库管理员去 Settings → Pages 改一次 Source。
#   ★ 而这个文件只要入库就生效 —— 克隆者拿到的是
#     「开箱即用的 Pages 配置」，不用任何手动步骤。
#
# ★★★ 文件名必须是 _config.yml（有下划线前缀）★★★
#   我第一次写成 _cfg.yml —— Jekyll 根本不认它，
#   于是 include/exclude 完全没生效，Pages 照旧发布整个仓库。
#   ★ 这类「文件名写错 → 功能静默失效」的坑，
#     症状是「什么都没变」，很容易被忽略。
#
# ★★ 为什么不能配 .nojekyll：
#   有 .nojekyll 时 Jekyll **完全跳过** —— 连 include 也不生效，
#   于是整个仓库原样发布（正是我们要避免的）。
#   ★ 所以必须让 Jekyll 处理，才能用 include 控制范围。
#
# ══════════════════════════════════════════════════════
#  发布范围（两道闸，缺一不可）
# ══════════════════════════════════════════════════════
#
# ★★★ 为什么 exclude 和 include 都要写 ═══
#
# ★ include（白名单）单独用**不生效** —— 我实测过：
#   配好 include 后重新部署，Pages 上仍然能访问
#   /tools/bench.js、/docs/、/minigame/。
#   ★ 原因推测：GitHub 的 pages 构建用的是 `github-pages` gem，
#     它自带一套默认配置，与仓库的 _config.yml 合并时
#     `include` 没能覆盖住默认行为。
#   ★ **推测**而已 —— 我没拿到构建日志（要管理员权限）。
#     但结论是确定的：include 单独用不管用。
#
# ★ exclude（黑名单）是 Jekyll 最可靠的机制。
#   ★ 两者同时存在时 **exclude 优先** ——
#     所以 exclude 是「兜底闸」，include 是「意图声明」。
#   ★ 一旦以后 include 真的生效了，exclude 也不会误伤
#     （两者列的都是同一批东西）。
#
# ★ 双保险的实际价值：
#   单独用 include → 漏发布（当前状态）
#   单独用 exclude → 以后加新目录可能被意外发布
#   两者都用     → 无论哪个失效，另一个兜住
exclude:
  # ── 内部实现与测试 ──
  - tools
  - .github
  - .ci-node
  - node_modules
  # ── 文档（对外只保留 README）──
  - docs
  - DEPLOY.md
  - 上线资料.md
  - 真机验证清单.md
  # ── 小游戏端源码（不上 Pages）──
  - minigame
  - legal
  # ── 构建产物与配置本身 ──
  - dist
  - _config.yml
  - .gitignore

# ── 白名单：明确声明「Pages 应该发布什么」──
#   路径相对于**仓库根**；目录是递归的（js 会带上子目录 js/ui/）。
include:
  - index.html
  - styles.css
  - js
  - assets
  - README.md
  # ★ PWA（V20.6）：manifest 与 service worker 必须发布，
  #   否则「装到桌面」与离线都无从谈起。
  - manifest.json
  - sw.js

